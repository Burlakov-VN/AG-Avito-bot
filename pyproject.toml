[project]
name = "ag-avito-bot"
version = "0.1.0"
description = "Telegram-бот для генерации автозагрузки Avito"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "python-docx>=1.2.0",
    "aiogram>=3.25.0",
    "aiosqlite>=0.22.1",
    "fpdf2>=2.8",
]

[project.scripts]
avito-bot = "avito_autoload.bot.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avito_autoload"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
